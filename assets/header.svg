<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc">
  <title id="title">Jonathan Muñoz · ZuGo Labs</title>
  <desc id="desc">Terminal animada: jonathan@zugolabs ejecuta ./hola-mundo.sh. Software que mueve tu negocio: automatización con IA, apps para iOS y Android, plataformas web a medida e integraciones con CRM, WhatsApp y APIs.</desc>
  <style>
    svg{font-family:'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes cmd{from{transform:translateX(-135px)}to{transform:translateX(0)}}
    @keyframes on{0%,100%{opacity:1}}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @keyframes vis{0%,23%{opacity:1}24%,100%{opacity:0}}
    @keyframes p0{0%{transform:translateX(-265.2px)}8%,20%{transform:translateX(0)}23%,100%{transform:translateX(-265.2px)}}
    @keyframes p1{0%{transform:translateX(-336.6px)}8%,20%{transform:translateX(0)}23%,100%{transform:translateX(-336.6px)}}
    @keyframes p2{0%{transform:translateX(-357px)}8%,20%{transform:translateX(0)}23%,100%{transform:translateX(-357px)}}
    @keyframes p3{0%{transform:translateX(-285.6px)}8%,20%{transform:translateX(0)}23%,100%{transform:translateX(-285.6px)}}
    @keyframes gl1{0%,90%,100%{opacity:0;transform:none}91%{opacity:.75;transform:translate(-3px,1px)}93%{opacity:.75;transform:translate(2px,-1px)}95%{opacity:0;transform:none}}
    @keyframes gl2{0%,90%,100%{opacity:0;transform:none}91%{opacity:.7;transform:translate(3px,-1px)}93%{opacity:.7;transform:translate(-2px,2px)}95%{opacity:0;transform:none}}
    .f1{animation:in .6s ease-out 1.5s both}
    .f2{animation:in .6s ease-out 1.8s both}
    .f3{animation:in .5s ease-out 2s both}
    .f4{animation:in .6s ease-out 2.3s both}
    .r1{animation:in .3s ease-out 2.5s both}
    .r2{animation:in .3s ease-out 2.8s both}
    .r3{animation:in .3s ease-out 3.1s both}
    .cmd{animation:cmd 1s steps(15) .4s both}
    .kc{opacity:0;animation:cmd 1s steps(15) .4s both,on 1.6s linear backwards}
    .blink{animation:blink 1s steps(1) infinite}
    .g1{opacity:0;animation:gl1 6s steps(1) 3s infinite}
    .g2{opacity:0;animation:gl2 6s steps(1) 3.1s infinite}
    .c0{animation:p0 16s steps(26) 2s infinite backwards}
    .k0{animation:p0 16s steps(26) 2s infinite backwards,vis 16s linear 2s infinite backwards}
    .c1{transform:translateX(-336.6px);animation:p1 16s steps(33) -10s infinite}
    .k1{opacity:0;transform:translateX(-336.6px);animation:p1 16s steps(33) -10s infinite,vis 16s linear -10s infinite}
    .c2{transform:translateX(-357px);animation:p2 16s steps(35) -6s infinite}
    .k2{opacity:0;transform:translateX(-357px);animation:p2 16s steps(35) -6s infinite,vis 16s linear -6s infinite}
    .c3{transform:translateX(-285.6px);animation:p3 16s steps(28) -2s infinite}
    .k3{opacity:0;transform:translateX(-285.6px);animation:p3 16s steps(28) -2s infinite,vis 16s linear -2s infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#16C5E8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1268FF" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#16C5E8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#16C5E8" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".9" cy=".05" r=".6">
      <stop offset="0" stop-color="#16C5E8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#16C5E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".05" cy="1" r=".6">
      <stop offset="0" stop-color="#1268FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1268FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2F7BFF" stroke-opacity=".07"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#FFFFFF" fill-opacity=".02"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="win"><rect width="840" height="310" rx="14"/></clipPath>
    <clipPath id="cCmd"><rect class="cmd" x="220" y="64" width="137" height="22"/></clipPath>
    <clipPath id="cP0"><rect class="c0" x="51.4" y="208" width="268.2" height="28"/></clipPath>
    <clipPath id="cP1"><rect class="c1" x="51.4" y="208" width="339.6" height="28"/></clipPath>
    <clipPath id="cP2"><rect class="c2" x="51.4" y="208" width="360" height="28"/></clipPath>
    <clipPath id="cP3"><rect class="c3" x="51.4" y="208" width="288.6" height="28"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <!-- fondo -->
    <rect width="840" height="310" fill="#060B16"/>
    <rect width="840" height="310" fill="url(#grid)"/>
    <rect width="840" height="310" fill="url(#glowA)"/>
    <rect width="840" height="310" fill="url(#glowB)"/>

    <!-- barra de título -->
    <rect width="840" height="40" fill="#0B1426"/>
    <line x1="0" y1="40.5" x2="840" y2="40.5" stroke="#16304F"/>
    <circle cx="24" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="44" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="20" r="6" fill="#28C840"/>
    <text x="420" y="25" text-anchor="middle" font-size="13" fill="#5B6B85">jonathan@zugolabs: ~</text>

    <!-- prompt + comando -->
    <text x="32" y="80" font-size="15" textLength="180" lengthAdjust="spacing"><tspan fill="#16C5E8" font-weight="700">jonathan@zugolabs</tspan><tspan fill="#EDF4FF">:</tspan><tspan fill="#4D94FF">~</tspan><tspan fill="#EDF4FF">$</tspan></text>
    <text x="221" y="80" font-size="15" fill="#EDF4FF" textLength="135" lengthAdjust="spacing" clip-path="url(#cCmd)">./hola-mundo.sh</text>
    <rect class="kc" x="357" y="66" width="9" height="18" fill="#16C5E8"/>

    <!-- nombre -->
    <g class="f1">
      <text class="g1" x="32" y="142" font-size="46" font-weight="800" fill="#16C5E8">Jonathan Muñoz</text>
      <text class="g2" x="32" y="142" font-size="46" font-weight="800" fill="#1268FF">Jonathan Muñoz</text>
      <text x="32" y="142" font-size="46" font-weight="800" fill="url(#brand)" filter="url(#glow)">Jonathan Muñoz</text>
    </g>
    <text class="f2" x="32" y="176" font-size="15" fill="#8A9BB8"><tspan fill="#3D5A85">//</tspan> Software que mueve tu negocio · <tspan fill="#EDF4FF" font-weight="700">@ZuGo Labs</tspan></text>

    <!-- frases rotativas -->
    <g class="f3">
      <text x="32" y="228" font-size="17" font-weight="700" fill="#16C5E8">&gt;</text>
      <text x="52.4" y="228" font-size="17" fill="#EDF4FF" textLength="265.2" lengthAdjust="spacing" clip-path="url(#cP0)">automatizo procesos con IA</text>
      <text x="52.4" y="228" font-size="17" fill="#EDF4FF" textLength="336.6" lengthAdjust="spacing" clip-path="url(#cP1)">construyo apps para iOS y Android</text>
      <text x="52.4" y="228" font-size="17" fill="#EDF4FF" textLength="357" lengthAdjust="spacing" clip-path="url(#cP2)">desarrollo plataformas web a medida</text>
      <text x="52.4" y="228" font-size="17" fill="#EDF4FF" textLength="285.6" lengthAdjust="spacing" clip-path="url(#cP3)">conecto CRM, WhatsApp y APIs</text>
      <g class="blink">
        <rect class="k0" x="319.6" y="213" width="10" height="19" fill="#16C5E8"/>
        <rect class="k1" x="391" y="213" width="10" height="19" fill="#16C5E8"/>
        <rect class="k2" x="411.4" y="213" width="10" height="19" fill="#16C5E8"/>
        <rect class="k3" x="340" y="213" width="10" height="19" fill="#16C5E8"/>
      </g>
    </g>

    <!-- panel ZUGO/OS -->
    <g class="f2">
      <rect x="560" y="60" width="248" height="178" rx="10" fill="#0B1426" fill-opacity=".85" stroke="#16C5E8" stroke-opacity=".25"/>
      <text x="576" y="86" font-size="13" font-weight="800" fill="url(#brand)">ZUGO/OS</text>
      <text x="792" y="85" font-size="10" fill="#5B6B85" text-anchor="end" letter-spacing="1.5">SISTEMAS CONECTADOS</text>
      <line x1="576" y1="100.5" x2="792" y2="100.5" stroke="#16304F"/>
      <g class="r1">
        <text x="576" y="126" font-size="12" fill="#C9D6EE"><tspan fill="#16C5E8">▸</tspan> flujos automatizados</text>
        <text x="792" y="126" font-size="12" fill="#5B6B85" text-anchor="end">[ <tspan fill="#3DDC97" font-weight="700">OK</tspan> ]</text>
      </g>
      <g class="r2">
        <text x="576" y="152" font-size="12" fill="#C9D6EE"><tspan fill="#16C5E8">▸</tspan> experiencia móvil</text>
        <text x="792" y="152" font-size="12" fill="#5B6B85" text-anchor="end">[ <tspan fill="#3DDC97" font-weight="700">OK</tspan> ]</text>
      </g>
      <g class="r3">
        <text x="576" y="178" font-size="12" fill="#C9D6EE"><tspan fill="#16C5E8">▸</tspan> web alto rendimiento</text>
        <text x="792" y="178" font-size="12" fill="#5B6B85" text-anchor="end">[ <tspan fill="#3DDC97" font-weight="700">OK</tspan> ]</text>
      </g>
      <rect x="576" y="198" width="168" height="6" rx="3" fill="#13213A"/>
      <rect x="576" y="198" width="168" height="6" rx="3" fill="#16C5E8">
        <animate attributeName="width" values="0;0;168" keyTimes="0;.62;1" dur="3.9s" fill="freeze"/>
      </rect>
      <text x="792" y="205" font-size="11" fill="#16C5E8" text-anchor="end">100%</text>
      <text x="576" y="226" font-size="10" fill="#5B6B85">captura · CRM · seguimiento</text>
    </g>

    <!-- barra de estado -->
    <g class="f4">
      <line x1="32" y1="256.5" x2="808" y2="256.5" stroke="#1A2A44" stroke-dasharray="4 5"/>
      <circle cx="38" cy="280" r="4" fill="#3DDC97"/>
      <circle cx="38" cy="280" r="4" fill="none" stroke="#3DDC97">
        <animate attributeName="r" values="4;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="52" y="284.5" font-size="13" fill="#8A9BB8">aceptando nuevos proyectos</text>
      <text x="808" y="284.5" font-size="13" fill="#5B6B85" text-anchor="end">zugolabs.com · México</text>
    </g>

    <rect width="840" height="310" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="839" height="309" rx="13.5" fill="none" stroke="url(#edge)"/>
</svg>
